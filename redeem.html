  .btn-secondary:hover { background: var(--raise-strong); }
  .btn-secondary:disabled { opacity: .6; cursor: default; }
  .btn-secondary:focus-visible { outline: 2px solid var(--accent-b); outline-offset: 2px; }
  .r-google { align-self: flex-start; }
  .r-link { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-b); text-decoration: underline; cursor: pointer; align-self: flex-start; }
